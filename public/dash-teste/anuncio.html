<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title data-i18n="anuncio.anuncio">Anúncio</title>
<!-- Página pública de UM anúncio do Meta: preview + métricas do período.
     Servida em /anuncio/<token> (rewrite no vercel.json) e também em
     /dash-teste/anuncio.html?s=<token>. Tudo inline: o caminho da URL muda
     conforme a rota, então nada de arquivo relativo. Dados de /api/anuncio-publico. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F3F4; --surface: #FFFFFF; --surface-2: #F7F8F9; --border: #E7E9EB;
    --ink: #020027; --text: #1F2542; --muted: #6F6F6F; --faint: #A8ACB8;
    --accent: #154490; --accent-2: #2F6BD4; --accent-soft: #E5EDFB; --on-accent: #FFFFFF;
    --bad: #D64545;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B0F1E; --surface: #131A2E; --surface-2: #182038; --border: #243050;
      --ink: #EEF2FF; --text: #CDD5EA; --muted: #8C97B3; --faint: #5E6984;
      --accent: #2F6BD4; --accent-2: #6E9BF0; --accent-soft: #1A2748; --on-accent: #FFFFFF;
      --bad: #F07A7A;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 500 15px/1.45 Urbanist, ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 28px 16px 40px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-2); margin: 0 0 4px; }
  h1 { margin: 0 0 18px; font-size: 22px; line-height: 1.25; font-weight: 800; color: var(--ink); overflow-wrap: anywhere; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab { padding: 7px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
    color: var(--text); font: 700 12px/1 Urbanist, ui-sans-serif, system-ui; cursor: pointer; }
  .tab:hover { border-color: var(--accent-2); }
  .tab.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .preview { min-height: 420px; display: flex; align-items: center; justify-content: center; background: var(--surface-2); }
  .preview iframe { display: block; width: 100%; height: 620px; border: 0; background: #fff; }
  .msg { padding: 32px 20px; text-align: center; color: var(--muted); font-size: 14px; }
  .spin { width: 26px; height: 26px; margin: 0 auto 10px; border: 3px solid var(--border); border-top-color: var(--accent-2);
    border-radius: 50%; animation: g 0.8s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  .periodo { display: flex; align-items: center; gap: 8px; margin: 20px 0 10px; font-size: 14px; color: var(--muted); }
  .periodo b { color: var(--ink); font-weight: 700; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 14px 12px; min-width: 0; }
  .tile-l { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .tile-v { margin-top: 6px; font-size: 26px; line-height: 1.1; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere; }
  .tile-v.na { font-size: 16px; font-weight: 700; color: var(--faint); }
  .tile-h { margin-top: 6px; font-size: 12px; color: var(--faint); }
  .foot { margin-top: 18px; font-size: 12px; color: var(--faint); text-align: center; }
  .erro { margin-top: 40px; }
  .erro h1 { margin-bottom: 8px; }
  .erro p { color: var(--muted); margin: 0; }
  @media (max-width: 360px) { .tile-v { font-size: 22px; } }
</style>
</head>
<body>
<main class="wrap" id="app">
  <div class="msg"><div class="spin"></div><span data-i18n="anuncio.carregando">Carregando anúncio…</span></div>
</main>
<script type="module">
// Caminho absoluto: a página também é servida em /anuncio/<token>, onde um caminho relativo quebraria.
import { t as tt, locale as localeAtual, idioma as idiomaAtual, registrar, traduzirDom } from '/dash-teste/vendor/viewerI18n.js'
import anuncio from '/dash-teste/vendor/i18n/anuncio.js'
registrar('anuncio', anuncio)
traduzirDom()

var FORMATOS = [
  ['formatos.feed', 'MOBILE_FEED_STANDARD'], ['formatos.instagram', 'INSTAGRAM_STANDARD'],
  ['formatos.storiesIg', 'INSTAGRAM_STORY'], ['formatos.storiesFb', 'FACEBOOK_STORY_MOBILE'], ['formatos.desktop', 'DESKTOP_FEED_STANDARD'],
]
var app = document.getElementById('app')
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] }) }

// Token: /anuncio/<token> ou ?s=<token>
var m = location.pathname.match(/\/anuncio\/([^/?#]+)/)
var token = (m && decodeURIComponent(m[1])) || new URLSearchParams(location.search).get('s') || ''
var api = function (extra) { return '/api/anuncio-publico?s=' + encodeURIComponent(token) + (extra || '') }
var buscar = function (url) { return fetch(url, { headers: { 'X-Idioma': idiomaAtual() } }) }

// O que está na tela, para redesenhar na troca de idioma: { erro: [titulo, texto] } ou { d, fmt }.
var tela = null

function erro(titulo, texto) {
  tela = { erro: [titulo, texto] }
  app.innerHTML = '<div class="erro"><h1>' + esc(titulo()) + '</h1><p>' + esc(texto()) + '</p></div>'
}
var chave = function (k) { return function () { return tt('anuncio.' + k) } }
var fixo = function (txt) { return function () { return txt } }

var brl = function (v) { return v.toLocaleString(localeAtual(), { style: 'currency', currency: 'BRL' }) }
var pct = function (v) { return v.toLocaleString(localeAtual(), { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%' }
var dataBR = function (iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString(localeAtual(), { day: '2-digit', month: '2-digit', year: 'numeric' }) }

function tile(rotulo, valor, vazio, dica) {
  var tem = valor != null
  return '<div class="tile"><div class="tile-l">' + rotulo + '</div>' +
    '<div class="tile-v' + (tem ? '' : ' na') + '">' + (tem ? valor : esc(vazio)) + '</div>' +
    '<div class="tile-h">' + dica + '</div></div>'
}

function carregarPreview(fmt) {
  var prev = document.getElementById('prev')
  if (!prev) return
  tela.fmt = fmt
  prev.innerHTML = '<div class="msg"><div class="spin"></div>' + esc(tt('anuncio.carregandoPreview')) + '</div>'
  buscar(api('&preview=' + fmt)).then(function (r) {
    return r.json().catch(function () { return {} }).then(function (x) { return { ok: r.ok, x: x } })
  }).then(function (res) {
    if (tela.fmt !== fmt) return
    if (!res.ok) { prev.innerHTML = '<div class="msg">' + esc((res.x.error && res.x.error.message) || tt('anuncio.previewIndisponivel')) + '</div>'; return }
    var ifr = document.createElement('iframe')
    // Sem allow-same-origin: os scripts do Meta rodam isolados desta página.
    ifr.setAttribute('sandbox', 'allow-scripts allow-popups')
    ifr.setAttribute('title', tt('anuncio.previewTitulo'))
    ifr.srcdoc = res.x.html || ''
    prev.innerHTML = ''; prev.appendChild(ifr)
  }).catch(function () { if (tela.fmt === fmt) prev.innerHTML = '<div class="msg">' + esc(tt('anuncio.falhaPreview')) + '</div>' })
}

function desenhar(d, fmt) {
  tela = { d: d, fmt: fmt }
  var mt = d.metricas || {}
  var nome = (d.anuncio && d.anuncio.nome) || tt('anuncio.anuncio')
  document.title = nome + ' | ' + tt('anuncio.anuncio')
  app.innerHTML =
    '<p class="eyebrow">' + esc(tt('anuncio.anuncio')) + '</p><h1>' + esc(nome) + '</h1>' +
    '<div class="tabs" role="tablist">' + FORMATOS.map(function (f) {
      var on = f[1] === fmt
      return '<button type="button" role="tab" class="tab' + (on ? ' on' : '') + '" data-fmt="' + f[1] + '" aria-selected="' + on + '">' + esc(tt('anuncio.' + f[0])) + '</button>'
    }).join('') + '</div>' +
    '<div class="card preview" id="prev"></div>' +
    '<div class="periodo">' + tt('anuncio.periodo', { de: '<b>' + dataBR(d.periodo.de) + '</b>', ate: '<b>' + dataBR(d.periodo.ate) + '</b>' }) + '</div>' +
    '<div class="grid">' +
      tile('CTR', mt.ctr != null ? pct(mt.ctr) : null, tt('anuncio.semImpressoes'), esc(tt('anuncio.dicaCtr'))) +
      tile('CPM', mt.cpm != null ? brl(mt.cpm) : null, tt('anuncio.semImpressoes'), esc(tt('anuncio.dicaCpm'))) +
      tile(esc(tt('anuncio.taxaConversao')), mt.taxa_conversao != null ? pct(mt.taxa_conversao) : null, tt('anuncio.semCliques'), esc(tt('anuncio.dicaTaxa'))) +
      tile('CPL', mt.cpl != null ? brl(mt.cpl) : null, tt('anuncio.semLeads'), esc(tt('anuncio.dicaCpl'))) +
    '</div>' +
    '<p class="foot">' + esc(tt('anuncio.rodape')) + '</p>'

  app.querySelectorAll('.tab').forEach(function (b) {
    b.onclick = function () {
      app.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('on'); x.setAttribute('aria-selected', 'false') })
      b.classList.add('on'); b.setAttribute('aria-selected', 'true'); carregarPreview(b.dataset.fmt)
    }
  })
  carregarPreview(fmt)
}

window.addEventListener('idioma-mudou', function () {
  traduzirDom()
  if (!tela) return
  if (tela.erro) erro(tela.erro[0], tela.erro[1])
  else desenhar(tela.d, tela.fmt)
})

if (!token) {
  erro(chave('linkIncompleto'), chave('linkIncompletoTexto'))
} else {
  buscar(api()).then(function (r) {
    return r.json().catch(function () { return {} }).then(function (d) { return { ok: r.ok, status: r.status, d: d } })
  }).then(function (res) {
    if (!res.ok) {
      if (res.status === 403) erro(chave('linkInvalido'), chave('linkInvalidoTexto'))
      else if (res.status === 404) erro(chave('naoEncontrado'), chave('naoEncontradoTexto'))
      else {
        var msgApi = res.d && res.d.error && res.d.error.message
        erro(chave('naoAbriu'), msgApi ? fixo(msgApi) : chave('tenteDeNovo'))
      }
      return
    }
    desenhar(res.d, FORMATOS[0][1])
  }).catch(function () { erro(chave('naoAbriu'), chave('verifiqueConexao')) })
}
</script>
</body>
</html>
